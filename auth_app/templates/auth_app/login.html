{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | VENDORA</title>
  <style>
    :root{
      --ink:#1c2a33; --muted:#5d6b73; --bg:#eef2ee; --green:#1f6f46; --green-dark:#154d31;
      --sign:#f4b400; --red:#b3261e;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;
      font-family:"Segoe UI",Tahoma,Verdana,sans-serif;line-height:1.5;color:var(--ink);
      background:
        linear-gradient(rgba(28,42,51,.72), rgba(28,42,51,.72)),
        url("{% static 'images/tindahanbg.jpeg' %}") center / cover no-repeat fixed;
      background-color:var(--ink)}
    :focus-visible{outline:3px solid var(--sign);outline-offset:2px}

    .login-card{width:100%;max-width:420px;background:#fff;border:2px solid var(--ink);
      border-radius:4px 14px 14px 4px;padding:1.8rem 1.8rem 1.6rem;box-shadow:5px 5px 0 #0e171d}
    .signboard{background:var(--sign);color:var(--ink);font-family:"Arial Black",Impact,sans-serif;letter-spacing:.04em;
      text-align:center;padding:.45rem 1rem;font-size:.9rem;border:4px solid var(--ink);border-radius:6px;
      box-shadow:3px 3px 0 #0e171d;width:max-content;margin:0 auto 1.2rem}
    h1{font-family:"Franklin Gothic Medium","Arial Narrow",Arial,sans-serif;font-size:1.5rem;margin:0 0 .3rem;line-height:1.2;color:var(--green-dark)}
    .muted{color:var(--muted);margin:0 0 1rem;font-size:.95rem}
    .error{color:var(--red);font-weight:700;margin:.2rem 0 .6rem;font-size:.9rem}
    .success{color:var(--green-dark);font-weight:700;margin:.2rem 0 .6rem;font-size:.9rem}

    label{display:block;font-weight:700;margin:.9rem 0 .3rem;font-size:.95rem}
    input[type=text],input[type=password],input[type=email]{width:100%;font:inherit;padding:.65rem .8rem;
      border:2px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink)}
    input:focus{outline:3px solid var(--sign);outline-offset:1px;border-color:var(--ink)}

    .btn{display:block;width:100%;font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;
      border-radius:6px;padding:.7rem 1rem;transition:background .15s,color .15s}
    .btn-primary{margin-top:1.3rem;background:var(--green);color:#fff;border:2px solid var(--green)}
    .btn-primary:hover{background:var(--green-dark);border-color:var(--green-dark)}
    .btn-outline{background:#fff;color:var(--ink);border:2px solid var(--ink)}
    .btn-outline:hover{background:var(--sign);border-color:var(--ink)}

    .divider{display:flex;align-items:center;gap:.8rem;margin:1.2rem 0 .8rem;color:var(--muted);font-size:.85rem;font-weight:600}
    .divider::before,.divider::after{content:"";flex:1;height:2px;background:#dfe6e2}

    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>

<body>
  <main class="login-card">
    <a href="{% url 'dashboard' %}" style="display:block;line-height:0;text-align:center;margin:0 0 1.2rem;">
      <img src="{% static 'images/vendoralogo.png' %}" alt="VENDORA" style="height:44px;width:auto;display:inline-block;">
    </a>

    <h1>Sign in</h1>
    <p class="muted">Enter your username and password to open the dashboard.</p>

    {% if messages %}
      {% for message in messages %}
        <p class="{% if message.tags == 'success' %}success{% else %}error{% endif %}">{{ message }}</p>
      {% endfor %}
    {% endif %}

    <form action="{% url 'login' %}" method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autofocus autocomplete="username">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">

      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>

    <div class="divider">Don't have an account yet?</div>
    <a href="{% url 'register' %}" class="btn btn-outline">Register</a>
  </main>
</body>
</html>
